{{define "content"}}
<div class="dashboard-container">

    <div class="hero-card">
        <h1>Welcome Back, {{.Username}}!</h1>
        <p>Ready to earn today's attendance coins?</p>
    </div>

    <section class="dashboard-avatar-card" aria-label="Current avatar">
        {{template "avatarStack" .AvatarPreview}}
        <div>
            <h2>Your Avatar</h2>
            {{if .AvatarSummary}}
            <div class="avatar-summary-list">
                {{range .AvatarSummary}}<span>{{.}}</span>{{end}}
            </div>
            {{else}}
            <p>No avatar selected yet.</p>
            {{end}}
        </div>
    </section>

</div>
{{end}}

{{template "base" .}}
