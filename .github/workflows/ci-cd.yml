name: CI/CD

on:
  push:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Vet, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Log toolchain
        run: |
          go version
          go env GOOS GOARCH GOMOD

      - name: Download modules
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Run unit, component, and adapter tests
        run: go test -count=1 -shuffle=on ./...

      - name: Build server
        run: go build -trimpath -o /tmp/attendance-web ./cmd/webserver

  race:
    name: Race detection
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Run tests with the race detector
        run: go test -race -count=1 -shuffle=on ./...

  postgres-integration:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: attendance
          POSTGRES_PASSWORD: integration-password
          POSTGRES_DB: attendance_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U attendance -d attendance_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://attendance:integration-password@localhost:5432/attendance_test?sslmode=disable
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Run PostgreSQL store integration tests
        run: go test -tags=integration -count=1 -v ./internal/store

  deliver:
    name: Publish deployable artifact
    needs:
      - validate
      - race
      - postgres-integration
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build Linux server
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" -o dist/attendance-web ./cmd/webserver
          chmod 0755 dist/attendance-web
          tar -C dist -czf attendance-web-linux-amd64.tar.gz attendance-web
          sha256sum attendance-web-linux-amd64.tar.gz | tee attendance-web-linux-amd64.tar.gz.sha256

      - name: Upload deployment bundle
        uses: actions/upload-artifact@v7
        with:
          name: attendance-web-linux-amd64-${{ github.sha }}
          path: |
            attendance-web-linux-amd64.tar.gz
            attendance-web-linux-amd64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14
